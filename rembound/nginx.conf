user www-data;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/rembound-nginx.pid;
events {worker_connections 256;}
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log /dev/stdout;
 client_max_body_size 128k;
 keepalive_timeout 30s;
 map $http_upgrade $connection_upgrade {default upgrade; '' close;}
 server {
  listen 0.0.0.0:10000;
  server_name _;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  auth_basic "Rembound - laboratorio privado";
  auth_basic_user_file /tmp/rembound_htpasswd;
  location = /healthz {
   auth_basic off;
   access_log off;
   default_type application/json;
   alias /tmp/rembound-health.json;
  }
  location ~ ^/v1/database/gunbound/subscribe$ {
   auth_basic off;
   if ($http_origin != "https://rembound-lab-mvioli7.onrender.com") {return 403;}
   if ($http_upgrade != "websocket") {return 403;}
   proxy_pass http://127.0.0.1:3002;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection $connection_upgrade;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_read_timeout 600s;
   proxy_send_timeout 600s;
  }
  location /v1/ {return 403;}
  location / {
   proxy_pass http://127.0.0.1:3000;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto https;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_read_timeout 45s;
  }
 }
}
