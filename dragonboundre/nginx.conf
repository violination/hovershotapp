user www-data;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  client_max_body_size 100k;
  client_body_timeout 10s;
  keepalive_timeout 30s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  limit_req_zone $binary_remote_addr zone=req:10m rate=12r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  server {
    listen 0.0.0.0:10000;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    auth_basic "DragonBoundRE - ambiente privado de teste";
    auth_basic_user_file /tmp/dragonboundre_htpasswd;
    location = /healthz {
      auth_basic off;
      access_log off;
      default_type application/json;
      alias /tmp/dragonboundre-health.json;
    }
    location ~* ^/(resetallserverandy|gift_owners|gift_gm|my_payments|cash|cash2|ban|pin|post_action|owners)(/|$) { return 404; }
    location /game/ {
      # Game server listens on 127.0.0.1:9001 and expects /<world id>.
      auth_basic off;
      if ($http_origin !~ "^https://dragonboundre-lab-mvioli7\.onrender\.com$") { return 403; }
      limit_conn conn 12;
      proxy_pass http://127.0.0.1:9001/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      # The old 180s idle timeout disconnected legitimate inactive turns.
      # Native WebSocket ping/pong runs every 25s on the private game server.
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
    location /static/ {
      alias /opt/dragonbound/src/web/public_html/data/;
      # The original client requests dozens of assets concurrently; with Render
      # forwarding all clients through 127.0.0.1 the old 12r/s shared bucket
      # returned 503 to game images/audio. Static files are disk-backed and cached.
      expires 1d;
      add_header Cache-Control "public, max-age=86400";
    }
    location / {
      # Keep a modest burst allowance for authenticated app routes while
      # the proxy presents a shared ingress address.
      limit_req zone=req burst=80 nodelay;
      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_http_version 1.1;
      proxy_read_timeout 45s;
    }
  }
}
